<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Let's Decorate!</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <h1>Let's Decorate!</h1>
    
    <div class="room-layout">
      <div class="button-row">
        <button class="color-btn pink" data-color="pink">Pink</button>
        <button class="color-btn red" data-color="red">Red</button>
        <button class="color-btn blue" data-color="blue">Blue</button>
        <button class="color-btn yellow" data-color="yellow">Yellow</button>
        <p class="scratch-hint">Click each plant to reveal it.</p>
        <p class="success-message" role="status" aria-live="polite" hidden>You did it!</p>
      </div>
      <div class="room">
        <div class="wall-plant">
          <img class="wall-art" src="Assets/Raw/wall_art_outline.svg" alt="wall art">
        </div>
        <div class="curtain-plant">
        <img class="curtain" src="Assets/Raw/curtain_outline.svg" alt="curtain">
        <img class="plant4" src="Assets/plants/plant4.png" alt="plant4">
        </div>
        <div class ="lamp-plant">
          <img class="lamp" src="Assets/Raw/floor_lamp_outline.svg" alt="floor lamp">
        <img class="plant1" src="Assets/plants/plant1.png" alt="plant1">
        </div>
        <div class="sofa-plant">
          <img class="sofa" src="Assets/Raw/sofa_outline.svg" alt="sofa">
        <img class="plant2" src="Assets/plants/plant2.png" alt="plant2">
        <img class="plant3" src="Assets/plants/plant3.png" alt="plant3">
        </div>
      </div>
    </div>
    <script src="Script.js"></script>
  </body>
</html>
