<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Let's Decorate!</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Let's Decorate!</h1>
    
   <div class="room">
  <img class="wall-art" src="Assets/wall_art_outline.svg" alt="wall art">
  <img class="curtain" src="Assets/curtain_outline.svg" alt="curtain">
  <img class="lamp" src="Assets/floor_lamp_outline.svg" alt="floor lamp">
  <img class="sofa" src="Assets/sofa_outline.svg" alt="sofa">
</div>

    <div class="button-row">

      <button class="color-btn pink">Pink</button>
      <button class="color-btn red">Red</button>
      <button class="color-btn blue">Blue</button>

      <button class="color-btn yellow">Yellow</button>
    </div>
  </body>
</html>
